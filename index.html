<!DOCTYPE html>
<html lang="mn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png">
<title>MXO утас</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--ln:#272b35;--tx:#e8eaf0;--mu:#8b93a7;--ac:#5b8cff;--ok:#3ecf8e;--er:#ff6b6b;--wr:#f5b84c}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;max-width:640px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--ln)}
header b{font-size:17px}header .sp{flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mu);flex:none}.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
#st{font-size:13px;color:var(--mu)}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:9px 14px;cursor:pointer}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff}button:disabled{opacity:.5}
#msgs{flex:1;overflow:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:10px}
.me{align-self:flex-end;background:var(--ac);color:#fff;border-radius:16px 16px 4px 16px;padding:9px 13px;max-width:88%;word-break:break-word;white-space:pre-wrap}
.bot{align-self:flex-start;background:var(--card);border:1px solid var(--ln);border-radius:16px 16px 16px 4px;padding:9px 13px;max-width:92%;word-break:break-word;white-space:pre-wrap}
.bot small{display:block;color:var(--mu);margin-top:4px;font-size:12px}
.bot.err{border-color:var(--er)}.bot.run{border-color:var(--wr)}.bot.done{border-color:#24503d}
.chips{display:flex;gap:8px;overflow:auto;padding:6px 12px}.chips button{white-space:nowrap;font-size:14px;padding:7px 12px}
form{display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
textarea,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;width:100%;outline:none}
textarea{resize:none;max-height:120px}textarea:focus,input:focus{border-color:var(--ac)}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px}
.center h1{margin:0;font-size:22px}.center p{margin:0;color:var(--mu)}
#code{text-transform:uppercase;letter-spacing:.25em;text-align:center;font-size:22px}
#err{color:var(--er);min-height:1.4em}
.hide{display:none!important}
</style></head><body><div id="app">
<div id="pair" class="center hide">
 <h1>MXO утас</h1>
 <p>Компьютер дээрээ MXO-г нээгээд <b>Утас холбох</b> товчийг дарна. Гарсан QR кодыг утасныхаа камераар уншуулна. QR уншуулах боломжгүй бол доор 8 тэмдэгтийн кодыг оруулна.</p>
 <input id="code" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="XXXXXXXX">
 <button id="bPair" class="pri">Холбох</button><div id="err"></div>
</div>
<div id="main" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
 <header><span class="dot" id="dot"></span><b>MXO</b><span id="st">…</span><span class="sp"></span><button id="bOut" title="Салгах">⎋</button></header>
 <div id="msgs"></div>
 <div class="chips" id="chips"></div>
 <form id="f"><textarea id="q" rows="1" placeholder="Команд эсвэл видеоны линк…"></textarea><button class="pri" id="bSend">➤</button></form>
</div></div>
<script>
const SB="https://bmwmdevitmefslizmsdo.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtd21kZXZpdG1lZnNsaXptc2RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE5NDUyODksImV4cCI6MjA5NzUyMTI4OX0.iGvU3vATdsXYFAHR2iqP3_dpFjqoqc1CzljhspxaccA",LS="mxo_phone_token";
const $=id=>document.getElementById(id);
const VID=/^(https?:\/\/)?([\w-]+\.)?(youtube\.com|youtu\.be|youtube-nocookie\.com|tiktok\.com|facebook\.com|fb\.watch|instagram\.com|twitter\.com|x\.com|vimeo\.com|dailymotion\.com|bilibili\.com)\//i;
const ERR={invalid:"Код буруу эсвэл хугацаа дууссан. MXO дээр шинэ QR үүсгэнэ үү.",locked:"Хэт олон буруу оролдлого. 1 минут хүлээнэ үү.",license:"Лиценз хүчингүй байна.",auth:"Холболт дууссан. MXO дээр шинээр QR үүсгэнэ үү.",rate:"Хэт олон команд. Түр хүлээнэ үү.",queue:"Дараалал дүүрсэн, өмнөх ажил дуустал хүлээнэ үү.",body:"Текст хоосон эсвэл хэт урт байна."};
async function rpc(fn,args){const r=await fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"},body:JSON.stringify(args)});if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}
const tok=()=>{try{return localStorage.getItem(LS)||""}catch(e){return""}};
const setTok=v=>{try{v?localStorage.setItem(LS,v):localStorage.removeItem(LS)}catch(e){}};
function show(pair){$("pair").classList.toggle("hide",!pair);$("main").classList.toggle("hide",pair);}
async function claim(secret){
  $("err").textContent="";$("bPair").disabled=true;
  try{const r=await rpc("mxo_remote_pair_claim",{p_secret:secret});
    if(r.ok){setTok(r.phone_token);start();return true;}
    $("err").textContent=ERR[r.code]||"Холбогдож чадсангүй";
  }catch(e){$("err").textContent="Сүлжээний алдаа: "+e.message;}
  $("bPair").disabled=false;return false;
}
$("bPair").onclick=()=>{const c=$("code").value.trim();if(c.length>=6)claim(c);};
$("bOut").onclick=()=>{if(confirm("Энэ утсыг салгах уу?")){setTok("");stop();show(true);}};
let timer=null,busy=false,last="";
const mm=s=>new Date(s).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
function render(cmds,online){
  $("dot").classList.toggle("on",!!online);
  $("st").textContent=online?"Компьютер асаалттай":"Компьютер холбогдоогүй";
  const sig=JSON.stringify(cmds);if(sig===last)return;last=sig;
  const box=$("msgs"),atEnd=box.scrollHeight-box.scrollTop-box.clientHeight<80;box.innerHTML="";
  if(!cmds.length){const d=document.createElement("div");d.className="bot";d.textContent="Сайн байна уу! MXO-д команд өгнө үү. Жишээ нь: «бүх мөрийн хурдыг тааруул» эсвэл видеоны линк илгээнэ.";box.appendChild(d);}
  for(const c of cmds){
    const m=document.createElement("div");m.className="me";m.textContent=(c.kind==="url"?"🔗 ":"")+c.body;box.appendChild(m);
    const b=document.createElement("div");b.className="bot "+(c.status==="error"?"err":c.status==="done"?"done":"run");
    let t=c.reply||c.progress||(c.status==="new"?"Дараалалд байна…":"Ажиллаж байна…");
    b.textContent=t;const s=document.createElement("small");s.textContent=({new:"⏳ хүлээж байна",running:"⚙ ажиллаж байна",done:"✓ дууслаа",error:"✗ алдаа"})[c.status]+" · "+mm(c.at);b.appendChild(s);box.appendChild(b);
  }
  if(atEnd||cmds.length)box.scrollTop=box.scrollHeight;
}
async function tick(){
  if(busy||document.hidden)return;busy=true;
  try{const r=await rpc("mxo_remote_inbox",{p_phone:tok()});
    if(r.ok)render(r.cmds||[],r.pc_online);
    else if(r.code==="auth"){setTok("");stop();show(true);$("err").textContent=ERR.auth;}
  }catch(e){$("st").textContent="Сүлжээ алдаатай";$("dot").classList.remove("on");}
  busy=false;
}
function start(){show(false);last="";tick();clearInterval(timer);timer=setInterval(tick,4000);}
function stop(){clearInterval(timer);timer=null;}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&tok())tick();});
async function send(text){
  text=text.trim();if(!text)return;
  const kind=VID.test(text.split(/\s+/)[0])?"url":"chat";
  $("bSend").disabled=true;
  try{const r=await rpc("mxo_remote_send",{p_phone:tok(),p_kind:kind,p_body:text});
    if(r.ok){$("q").value="";$("q").style.height="auto";last="";tick();}
    else if(r.code==="auth"){setTok("");stop();show(true);$("err").textContent=ERR.auth;}
    else alert(ERR[r.code]||"Илгээж чадсангүй");
  }catch(e){alert("Сүлжээний алдаа: "+e.message);}
  $("bSend").disabled=false;
}
$("f").onsubmit=e=>{e.preventDefault();send($("q").value);};
$("q").addEventListener("input",e=>{const t=e.target;t.style.height="auto";t.style.height=Math.min(120,t.scrollHeight)+"px";});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!/Mobi|Android|iPhone/i.test(navigator.userAgent)){e.preventDefault();send($("q").value);}});
const QUICK=["Одоогийн төлөв?","Бүх мөрийн хурдыг автоматаар тааруул","Бүх мөрийг эм хоолой болго"];
for(const t of QUICK){const b=document.createElement("button");b.type="button";b.textContent=t;b.onclick=()=>send(t);$("chips").appendChild(b);}
(async()=>{
  const h=new URLSearchParams(location.hash.slice(1)).get("p");
  if(h){history.replaceState(null,"",location.pathname+location.search);show(true);await claim(h);return;}
  if(tok())start();else show(true);
})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
